<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515"><title>Bo Ready Racing #38 — Sponsor Finder</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>BO READY RACING <em>#38</em></h1><p>2027 Sponsor Finder · Secure cloud tracker</p></header>
<main><section id="setup" class="panel hidden"><h2>Configuration needed</h2><p>Set your Supabase project URL and publishable key in <code>config.js</code>. Keep Row Level Security enabled.</p></section>
<section id="auth" class="panel"><h2>Sign in</h2><form id="auth-form"><label>Email<input id="login-email" type="email" autocomplete="username" required></label><label>Password<input id="login-password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button><p id="auth-error" class="error" role="alert"></p></form><p class="muted">Create your user in Supabase Authentication first. Disable public signups afterward.</p></section>
<section id="app" class="hidden"><div class="toolbar"><button id="new-btn">+ Add sponsor</button><button id="export-btn" class="secondary">Export CSV</button><button id="logout-btn" class="secondary">Sign out</button></div><div id="stats" class="stats" aria-live="polite"></div><section class="panel"><div class="filters"><input id="search" type="search" placeholder="Search name, city or email" aria-label="Search leads"><select id="state-filter" aria-label="Filter state"><option value="">All four states</option><option value="KS">Kansas</option><option value="NE">Nebraska</option><option value="MO">Missouri</option><option value="OK">Oklahoma</option></select><select id="status-filter" aria-label="Filter status"><option value="">All statuses</option></select></div><p id="message" class="muted" role="status"></p><div id="leads"></div></section></section>
</main>
<dialog id="editor"><form id="lead-form"><h2 id="editor-title">Add sponsor</h2><input id="lead-id" type="hidden"><div class="form-grid"><label>Business name<input id="name" required maxlength="200"></label><label>City<input id="city" required maxlength="100"></label><label>State<select id="state" required><option value="KS">Kansas</option><option value="NE">Nebraska</option><option value="MO">Missouri</option><option value="OK">Oklahoma</option></select></label><label>Official website<input id="website" type="url" placeholder="https://example.com"></label><label>Public email<input id="email" type="email" required></label><label>Email source URL<input id="email_source" type="url" required placeholder="https://example.com/contact"></label><label>Industry<input id="category" maxlength="100"></label><label>Status<select id="status"></select></label><label>Last contact<input id="last_contact" type="date"></label><label>Follow-up<input id="follow_up" type="date"></label><label class="full">Notes<textarea id="notes" rows="4"></textarea></label></div><p id="edit-error" class="error" role="alert"></p><div class="toolbar"><button type="submit">Save sponsor</button><button id="cancel-btn" type="button" class="secondary">Cancel</button><button id="delete-btn" type="button" class="danger hidden">Delete</button></div></form></dialog>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="app.js"></script></body></html>
